<!-- @dsCard group="Formulários" height=200 subtitle="Escolher uma opção entre poucas" -->
<div class="ds-root" style="padding:16px;display:flex;flex-direction:column;gap:24px">
  <fieldset class="choices choices--row">
    <legend class="choices__legend">Quanto tempo você pode ficar?</legend>
    <label class="choice"><input type="radio" name="t" checked> O tempo todo</label>
    <label class="choice"><input type="radio" name="t"> Só a primeira hora</label>
  </fieldset>
  <fieldset class="choices" style="max-width:320px">
    <legend class="choices__legend">O que você prefere fazer?</legend>
    <label class="choice"><input type="checkbox" checked> Varrer</label>
    <label class="choice"><input type="checkbox"> Banheiros</label>
  </fieldset>
</div>
