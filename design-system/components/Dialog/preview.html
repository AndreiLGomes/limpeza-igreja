<!-- @dsCard group="Retorno" height=300 subtitle="Janela de confirmação antes de uma ação que desfaz algo" -->
<div class="ds-root" style="padding:24px;background:var(--scrim);min-height:280px;display:flex;align-items:center">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="d-t">
    <h2 class="dialog__title" id="d-t">Cancelar sua presença?</h2>
    <p class="dialog__text">Você sai da escala de sexta, 16 de outubro. A vaga fica livre para outra pessoa.</p>
    <div class="dialog__actions">
      <button class="btn btn--secondary">Manter presença</button>
      <button class="btn btn--danger">Cancelar presença</button>
    </div>
  </div>
</div>
