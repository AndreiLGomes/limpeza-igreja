<!-- @dsCard group="Conteúdo" height=260 subtitle="Card de um dia de limpeza" -->
<div class="ds-root" style="padding:16px;background:var(--surface-alt)">
  <article class="card" style="max-width:420px">
    <div class="card__head">
      <div>
        <h3 class="card__title">Sexta, 16 de outubro</h3>
        <p class="card__meta">19h às 21h · 3 de 5 vagas preenchidas</p>
      </div>
      <span class="status status--pending">Faltam 2</span>
    </div>
    <div class="avatar-stack">
      <span class="avatar">AG</span><span class="avatar">JS</span><span class="avatar">MR</span><span class="avatar avatar--empty">+</span><span class="avatar avatar--empty">+</span>
    </div>
    <div class="card__actions">
      <button class="btn btn--primary">Confirmar presença</button>
      <button class="btn btn--ghost">Ver tarefas</button>
    </div>
  </article>
</div>
