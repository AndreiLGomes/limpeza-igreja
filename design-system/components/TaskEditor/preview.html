<!-- @dsCard group="Formulários" height=280 subtitle="Lista de tarefas que dá para editar, adicionar e remover" -->
<div class="ds-root" style="padding:16px;max-width:480px">
  <fieldset class="choices" style="gap:8px">
    <legend class="choices__legend">Tarefas desta sexta</legend>
    <div class="editlist">
      <div class="editlist__row"><input class="field__input" value="Varrer o salão" aria-label="Tarefa 1"><button class="btn btn--danger-ghost btn--icon" aria-label="Remover tarefa Varrer o salão"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
      <div class="editlist__row"><input class="field__input" value="Limpar os banheiros" aria-label="Tarefa 2"><button class="btn btn--danger-ghost btn--icon" aria-label="Remover tarefa Limpar os banheiros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
      <div class="editlist__row"><input class="field__input" placeholder="Ex.: tirar o lixo" aria-label="Tarefa 3"><button class="btn btn--danger-ghost btn--icon" aria-label="Remover tarefa 3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
      <button class="btn btn--secondary editlist__add" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Adicionar tarefa</button>
    </div>
  </fieldset>
</div>
