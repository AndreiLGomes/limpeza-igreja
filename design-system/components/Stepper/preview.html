<!-- @dsCard group="Formulários" height=130 subtitle="Número com botões de menos e mais" -->
<div class="ds-root" style="padding:16px">
  <div class="field">
    <label class="field__label" for="vagas">Vagas</label>
    <div class="stepper">
      <button class="btn btn--ghost btn--icon" aria-label="Menos uma vaga"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <input class="stepper__value" id="vagas" type="number" inputmode="numeric" min="1" max="30" value="5">
      <button class="btn btn--ghost btn--icon" aria-label="Mais uma vaga"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    </div>
    <span class="field__hint">Quantas pessoas são necessárias nesta sexta.</span>
  </div>
</div>
