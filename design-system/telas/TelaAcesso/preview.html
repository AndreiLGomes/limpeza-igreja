<!-- @dsCard group="Telas" page width=375 height=620 subtitle="Entrada na área de quem organiza, com senha" -->
<div class="ds-root" style="background:var(--surface-alt);min-height:100%;position:relative">
<header class="appbar"><span class="appbar__title wordmark wordmark--on-header">Limpeza da Igreja</span><nav class="appbar__nav" aria-label="Principal"><a class="appbar__link" href="#">Esta semana</a><a class="appbar__link" href="#">Escala</a><a class="appbar__link" href="#">Tarefas</a></nav></header>
<main style="padding:24px 16px 48px">
  <form class="form card" onsubmit="return false" style="padding:24px 16px">
    <div class="empty" style="padding:0;align-items:flex-start;text-align:left"><span class="empty__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span></div>
    <div class="form__head"><h2 class="form__title">Área de quem organiza</h2><p class="form__desc">Para criar sextas, mudar vagas e tarefas. Quem só vem limpar não precisa entrar aqui.</p></div>
    <label class="field field--error"><span class="field__label">Senha de organizador</span><input class="field__input" type="password" value="1234" aria-invalid="true" autocomplete="current-password"><span class="field__hint">Senha incorreta. Peça a senha para quem administra o app.</span></label>
    <div class="form__actions"><button type="button" class="btn btn--ghost">Voltar</button><button type="submit" class="btn btn--primary">Entrar</button></div>
  </form>
</main>
</div>
